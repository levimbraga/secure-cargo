[project]
name = "securecargo-backend"
version = "0.1.0"
description = "SecureCargo API: physics-tested cargo securement"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.165",
    "mujoco>=4.0.1,<5",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "mypy>=2.4",
    "pytest>=9.2",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app", "scene", "physics", "rules", "planner", "perception", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["mujoco", "mujoco.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
